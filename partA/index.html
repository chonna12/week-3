<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <title>ES6 Essentials</title>
</head>
<body>
    <script>
        const studentName = "Alice";
        let currentYear = 2;
        
        console.log("Student Name:", studentName);
        console.log("Current Year:", currentYear);

        // เปลี่ยนค่า currentYear เป็น 3
        currentYear = 3;
        console.log("Updated Current Year:", currentYear);

        // ถ้าลองพยายามเปลี่ยน studentName = "Bob"; จะเกิด Error (TypeError: Assignment to constant variable.)
    </script>
</body>
</html>
